[package]
name = "tinycache"
version = "0.1.0"
edition = "2021"
description = "Lightweight, fast, Redis-like in-memory cache with Python bindings"
license = "MIT"
readme = "README.md"
repository = "https://github.com/4ursmile/tinycache"

[lib]
name = "_tinycache"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
ahash = "0.8"
parking_lot = "0.12"
pyo3 = { version = "0.23", features = ["abi3-py39", "extension-module"], optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "store_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
