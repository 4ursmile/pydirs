name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and Rust tests (no Python feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --no-default-features

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build and test tools
        run: pip install maturin "pytest>=7" pytest-asyncio

      - name: Build and install extension (release)
        run: maturin develop --release

      # No version pin: pip resolves a pydantic release that supports each Python in the matrix.
      - name: Install pydantic (optional extra, exercised by tests)
        run: pip install pydantic

      - name: Run Python tests (leak tests run in the leaks job)
        run: pytest -m "not leak"

  leaks:
    name: Memory-leak tests (Linux)
    needs: lint
    runs-on: ubuntu-latest
    env:
      # Leak tests read this to scale iteration counts down under valgrind.
      TINYCACHE_VALGRIND: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install valgrind and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind jq

      - name: Build Rust test binaries
        run: |
          cargo test --no-default-features --no-run --message-format=json > cargo-test-build.json
          # Both the lib unit-test binary and the tests/leaks.rs binary must build.
          TARGETS='["_tinycache", "leaks"]'
          jq -r --argjson targets "$TARGETS" '
            select(.reason == "compiler-artifact" and .profile.test == true and .executable != null)
            | select(.target.name as $n | $targets | index($n))
            | .executable' cargo-test-build.json > test-binaries.txt
          echo "Test binaries to check:"
          cat test-binaries.txt
          if [ ! -s test-binaries.txt ]; then
            echo "::error::No lib test binary found in cargo JSON output."
            exit 1
          fi

      - name: Run Rust tests under valgrind
        run: |
          while read -r bin; do
            echo "::group::valgrind $bin"
            valgrind --leak-check=full --errors-for-leak-kinds=definite \
              --error-exitcode=1 "$bin" --test-threads=1
            echo "::endgroup::"
          done < test-binaries.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install extension (release)
        run: |
          pip install maturin "pytest>=7" pytest-asyncio pydantic
          maturin develop --release

      - name: Run Python leak tests
        run: |
          pytest -m leak -v
